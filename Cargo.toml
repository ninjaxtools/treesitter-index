[package]
name = "kestrel-treesitter-index"
version = "0.6.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/ninjaxtools/treesitter-index"

[package.metadata.dist]
dist = true

[[bin]]
name = "treesitter-index"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "=0.27.0"
tree-sitter-go = "=0.23.4"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.23.1"
tree-sitter-md = "=0.5.3"
tree-sitter-python = "=0.23.6"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[profile.release]
codegen-units = 1
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
